name: Checks
on: [push, pull_request]
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install jsonschema==4.23.0 PyYAML==6.0.2
      - run: python3 deploy/features.py check
      - run: python3 deploy/client_release.py --destination ~/.cache/loom-use-contract
      - run: python3 tests/run.py --output /tmp/loom-tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: /tmp/loom-tests
