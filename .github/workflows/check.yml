name: Checks
on: [push, pull_request]
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install jsonschema==4.23.0 PyYAML==6.0.2
      - run: rustup toolchain install 1.100.0 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: python3 deploy/features.py check
      - run: python3 deploy/client_release.py --destination ~/.cache/loom-use-contract
      - run: docker pull python:3.12-slim
      - run: python3 tests/run.py --output /tmp/loom-tests
        env:
          LOOM_NATIVE_DOCKER_TEST: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: /tmp/loom-tests
